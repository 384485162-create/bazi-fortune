<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生运势K线图 - 八字命理量化分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --success: #059669;
            --danger: #dc2626;
            --accent: #f59e0b;
            --love: #ec4899;
            --health: #10b981;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --up-color: #10b981;
            --down-color: #ef4444;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
            color: var(--text-primary);
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        /* 顶部导航 */
        .top-bar {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 15px 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }
        
        .logo {
            font-size: 1.5em;
            font-weight: 800;
            color: var(--primary-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .market-status {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 15px;
            border-radius: 8px;
            background: rgba(59, 130, 246, 0.1);
        }
        
        .status-label {
            font-size: 0.75em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        
        .status-value {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--up-color);
        }
        
        .status-value.down {
            color: var(--down-color);
        }
        
        /* 主内容区 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        @media (min-width: 1200px) {
            .main-grid {
                grid-template-columns: 320px 1fr;
            }
        }
        
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 25px;
        }
        
        .card-title {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        
        .card-title .icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(59, 130, 246, 0.2);
        }
        
        /* 输入区域 */
        .input-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .input-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        
        .input-item label {
            font-size: 0.8em;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        
        .input-item input,
        .input-item select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--bg-dark);
            color: var(--text-primary);
            transition: all 0.2s;
        }
        
        .input-item input:focus,
        .input-item select:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        
        .btn-secondary {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.1);
        }
        
        /* 八字展示 */
        .bazi-section {
            display: none;
        }
        
        .bazi-section.show {
            display: block;
            margin-top: 20px;
        }
        
        .bazi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        
        .bazi-pillar {
            text-align: center;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            padding: 10px 5px;
        }
        
        .pillar-title {
            font-size: 0.7em;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .pillar-chars {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .pillar-char {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin: 0 auto;
        }
        
        .pillar-element {
            font-size: 0.7em;
            color: var(--accent);
            margin-top: 3px;
        }
        
        /* 图表区域 */
        .chart-section {
            display: none;
        }
        
        .chart-section.show {
            display: block;
        }
        
        /* 时间范围选择器 */
        .time-range-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .range-btn {
            padding: 6px 16px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .range-btn:hover {
            border-color: var(--primary-light);
            color: var(--primary-light);
        }
        
        .range-btn.active {
            background: var(--primary-light);
            border-color: var(--primary-light);
            color: white;
        }
        
        .year-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(59, 130, 246, 0.05);
            border-radius: 8px;
        }
        
        .year-selector label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.85em;
        }
        
        .year-selector select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-dark);
            color: var(--text-primary);
            cursor: pointer;
        }
        
        .chart-container {
            position: relative;
            height: 380px;
            margin-bottom: 20px;
        }
        
        /* 指标卡片 */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .metric-card {
            background: rgba(59, 130, 246, 0.05);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border);
        }
        
        .metric-label {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .metric-value {
            font-size: 1.8em;
            font-weight: 700;
        }
        
        .metric-value.up {
            color: var(--up-color);
        }
        
        .metric-value.down {
            color: var(--down-color);
        }
        
        .metric-change {
            font-size: 0.85em;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .metric-change.up {
            color: var(--up-color);
        }
        
        .metric-change.down {
            color: var(--down-color);
        }
        
        .baseline {
            font-size: 0.7em;
            color: var(--text-secondary);
            margin-top: 3px;
            opacity: 0.7;
        }
        
        /* 月度建议 */
        .monthly-analysis {
            margin-top: 20px;
            display: none;
        }
        
        .monthly-analysis.show {
            display: block;
        }
        
        .monthly-analysis h3 {
            font-size: 1em;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .month-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .month-card {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            transition: all 0.2s;
        }
        
        .month-card:hover {
            border-color: var(--primary-light);
            background: rgba(59, 130, 246, 0.1);
        }
        
        .month-card.bullish {
            border-left: 3px solid var(--up-color);
        }
        
        .month-card.bearish {
            border-left: 3px solid var(--down-color);
        }
        
        .month-card.neutral {
            border-left: 3px solid var(--accent);
        }
        
        .month-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .month-name {
            font-weight: 700;
            font-size: 0.95em;
            color: var(--text-primary);
        }
        
        .month-score {
            font-size: 0.85em;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
        }
        
        .month-card.bullish .month-score {
            background: var(--up-color);
            color: white;
        }
        
        .month-card.bearish .month-score {
            background: var(--down-color);
            color: white;
        }
        
        .month-card.neutral .month-score {
            background: var(--accent);
            color: white;
        }
        
        .month-trend {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        
        .month-advice {
            font-size: 0.8em;
            color: var(--text-primary);
            line-height: 1.4;
        }
        
        /* 底部说明 */
        .disclaimer {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 20px;
            font-size: 0.8em;
            color: var(--accent);
            text-align: center;
        }
        
        @media (max-width: 1024px) {
            .metrics-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .month-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 640px) {
            .top-bar {
                flex-direction: column;
                gap: 15px;
            }
            
            .market-status {
                width: 100%;
                justify-content: space-between;
            }
            
            .input-grid {
                grid-template-columns: 1fr;
            }
            
            .month-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部状态栏 -->
        <div class="top-bar">
            <div class="logo">
                <span>📈</span>
                <span>人生运势K线图</span>
            </div>
            <div class="market-status">
                <div class="status-item">
                    <span class="status-label">当前指数</span>
                    <span class="status-value" id="currentIndex">--</span>
                </div>
                <div class="status-item">
                    <span class="status-label">涨跌幅</span>
                    <span class="status-value" id="changePercent">--</span>
                </div>
                <div class="status-item">
                    <span class="status-label">基准线</span>
                    <span class="status-value" style="color: var(--accent);">5.0</span>
                </div>
            </div>
        </div>
        
        <div class="main-grid">
            <!-- 左侧控制面板 -->
            <div class="left-column">
                <div class="card">
                    <h2 class="card-title">
                        <span class="icon">📊</span>
                        量化参数配置
                    </h2>
                    
                    <div class="input-grid">
                        <div class="input-item">
                            <label>出生年份</label>
                            <input type="number" id="year" value="1990" min="1900" max="2100">
                        </div>
                        <div class="input-item">
                            <label>出生月份</label>
                            <select id="month">
                                <option value="1">1月</option>
                                <option value="2">2月</option>
                                <option value="3">3月</option>
                                <option value="4">4月</option>
                                <option value="5">5月</option>
                                <option value="6">6月</option>
                                <option value="7">7月</option>
                                <option value="8">8月</option>
                                <option value="9">9月</option>
                                <option value="10">10月</option>
                                <option value="11">11月</option>
                                <option value="12">12月</option>
                            </select>
                        </div>
                        <div class="input-item">
                            <label>出生日期</label>
                            <input type="number" id="day" value="15" min="1" max="31">
                        </div>
                        <div class="input-item">
                            <label>出生时辰</label>
                            <select id="hour">
                                <option value="0">子时 23-01</option>
                                <option value="1">丑时 01-03</option>
                                <option value="2">寅时 03-05</option>
                                <option value="3">卯时 05-07</option>
                                <option value="4">辰时 07-09</option>
                                <option value="5">巳时 09-11</option>
                                <option value="6">午时 11-13</option>
                                <option value="7">未时 13-15</option>
                                <option value="8">申时 15-17</option>
                                <option value="9">酉时 17-19</option>
                                <option value="10">戌时 19-21</option>
                                <option value="11">亥时 21-23</option>
                            </select>
                        </div>
                        <div class="input-item">
                            <label>性别</label>
                            <select id="gender">
                                <option value="male">男</option>
                                <option value="female">女</option>
                            </select>
                        </div>
                    </div>
                    
                    <button class="btn-primary" onclick="calculateBazi()">🔮 开始量化分析</button>
                    <button class="btn-secondary" onclick="clearAll()">清空重置</button>
                    
                    <!-- 八字展示 -->
                    <div class="bazi-section" id="baziSection">
                        <h3 style="font-size: 0.9em; margin-bottom: 12px; color: var(--text-secondary);">八字命盘</h3>
                        <div class="bazi-grid">
                            <div class="bazi-pillar">
                                <div class="pillar-title">年柱</div>
                                <div class="pillar-chars">
                                    <div class="pillar-char" id="yearGan">甲</div>
                                    <div class="pillar-char" id="yearZhi">子</div>
                                </div>
                                <div class="pillar-element" id="yearElement">木水</div>
                            </div>
                            <div class="bazi-pillar">
                                <div class="pillar-title">月柱</div>
                                <div class="pillar-chars">
                                    <div class="pillar-char" id="monthGan">乙</div>
                                    <div class="pillar-char" id="monthZhi">丑</div>
                                </div>
                                <div class="pillar-element" id="monthElement">木土</div>
                            </div>
                            <div class="bazi-pillar">
                                <div class="pillar-title">日柱</div>
                                <div class="pillar-chars">
                                    <div class="pillar-char" id="dayGan">丙</div>
                                    <div class="pillar-char" id="dayZhi">寅</div>
                                </div>
                                <div class="pillar-element" id="dayElement">火木</div>
                            </div>
                            <div class="bazi-pillar">
                                <div class="pillar-title">时柱</div>
                                <div class="pillar-chars">
                                    <div class="pillar-char" id="hourGan">丁</div>
                                    <div class="pillar-char" id="hourZhi">卯</div>
                                </div>
                                <div class="pillar-element" id="hourElement">火木</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧图表区 -->
            <div class="right-column">
                <div class="card chart-section" id="chartSection">
                    <h2 class="card-title">
                        <span class="icon">📈</span>
                        运势K线走势图
                    </h2>
                    
                    <div class="time-range-selector">
                        <button class="range-btn active" onclick="changeTimeRange('year')">年线</button>
                        <button class="range-btn" onclick="changeTimeRange('month')">月线</button>
                        <button class="range-btn" onclick="changeTimeRange('decade')">大运周期</button>
                    </div>
                    
                    <div class="year-selector" id="yearSelector" style="display: none;">
                        <label>选择年份：</label>
                        <select id="selectedYear" onchange="updateChart()"></select>
                    </div>
                    
                    <div class="chart-container">
                        <canvas id="fortuneChart"></canvas>
                    </div>
                    
                    <!-- 指标卡片 -->
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-label">📊 综合指数</div>
                            <div class="metric-value" id="fortuneIndex">--</div>
                            <div class="metric-change" id="fortuneChange">--</div>
                            <div class="baseline">基准: 5.0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">💰 财运指数</div>
                            <div class="metric-value" id="wealthIndex">--</div>
                            <div class="metric-change" id="wealthChange">--</div>
                            <div class="baseline">基准: 5.0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">💕 情感指数</div>
                            <div class="metric-value" id="loveIndex">--</div>
                            <div class="metric-change" id="loveChange">--</div>
                            <div class="baseline">基准: 5.0</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-label">💚 健康指数</div>
                            <div class="metric-value" id="healthIndex">--</div>
                            <div class="metric-change" id="healthChange">--</div>
                            <div class="baseline">基准: 5.0</div>
                        </div>
                    </div>
                    
                    <!-- 月度分析 -->
                    <div class="monthly-analysis" id="monthlyAnalysis">
                        <h3>📊 月度市场分析</h3>
                        <div class="month-cards" id="monthCards"></div>
                    </div>
                    
                    <div class="disclaimer">
                        ⚠️ 风险提示：本系统基于传统命理学算法，仅供娱乐参考，不构成任何建议。人生充满不确定性，请理性看待。
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 天干
        const tianGan = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
        // 地支
        const diZhi = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
        // 天干五行
        const ganWuxing = {
            '甲': '木', '乙': '木', '丙': '火', '丁': '火', '戊': '土',
            '己': '土', '庚': '金', '辛': '金', '壬': '水', '癸': '水'
        };
        // 地支五行
        const zhiWuxing = {
            '子': '水', '丑': '土', '寅': '木', '卯': '木', '辰': '土',
            '巳': '火', '午': '火', '未': '土', '申': '金', '酉': '金',
            '戌': '土', '亥': '水'
        };
        // 月份名称
        const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', 
                           '七月', '八月', '九月', '十月', '十一月', '十二月'];
        
        // 全局变量
        let chart = null;
        let currentRange = 'year';
        let birthYearGlobal = 1990;
        let baziGlobal = null;
        let genderGlobal = 'male';
        let monthlyDataGlobal = null;
        
        // 计算年柱
        function getYearPillar(year) {
            const ganIndex = (year - 4) % 10;
            const zhiIndex = (year - 4) % 12;
            const gan = tianGan[ganIndex >= 0 ? ganIndex : ganIndex + 10];
            const zhi = diZhi[zhiIndex >= 0 ? zhiIndex : zhiIndex + 12];
            return { gan, zhi, element: ganWuxing[gan] + zhiWuxing[zhi] };
        }
        
        // 计算月柱
        function getMonthPillar(year, month) {
            const yearGanIndex = (year - 4) % 10;
            const monthGanStart = (yearGanIndex % 5) * 2;
            const ganIndex = (monthGanStart + month - 1) % 10;
            const zhiIndex = (month + 1) % 12;
            const gan = tianGan[ganIndex];
            const zhi = diZhi[zhiIndex];
            return { gan, zhi, element: ganWuxing[gan] + zhiWuxing[zhi] };
        }
        
        // 计算日柱
        function getDayPillar(year, month, day) {
            const baseDate = new Date(1900, 0, 31);
            const targetDate = new Date(year, month - 1, day);
            const diffDays = Math.floor((targetDate - baseDate) / (1000 * 60 * 60 * 24));
            const ganIndex = diffDays % 10;
            const zhiIndex = diffDays % 12;
            const gan = tianGan[ganIndex >= 0 ? ganIndex : ganIndex + 10];
            const zhi = diZhi[zhiIndex >= 0 ? zhiIndex : zhiIndex + 12];
            return { gan, zhi, element: ganWuxing[gan] + zhiWuxing[zhi] };
        }
        
        // 计算时柱
        function getHourPillar(dayGan, hour) {
            const dayGanIndex = tianGan.indexOf(dayGan);
            const hourGanStart = (dayGanIndex % 5) * 2;
            const ganIndex = (hourGanStart + hour) % 10;
            const gan = tianGan[ganIndex];
            const zhi = diZhi[hour];
            return { gan, zhi, element: ganWuxing[gan] + zhiWuxing[zhi] };
        }
        
        // 生成年度数据
        function generateYearlyData(birthYear, bazi, gender) {
            const ages = [];
            const fortunes = [];
            const wealth = [];
            const love = [];
            const health = [];
            
            const ganScore = (bazi.year.gan.charCodeAt(0) + bazi.month.gan.charCodeAt(0) + 
                            bazi.day.gan.charCodeAt(0) + bazi.hour.gan.charCodeAt(0)) % 50;
            const zhiScore = (bazi.year.zhi.charCodeAt(0) + bazi.month.zhi.charCodeAt(0) + 
                            bazi.day.zhi.charCodeAt(0) + bazi.hour.zhi.charCodeAt(0)) % 50;
            
            for (let age = 1; age <= 80; age++) {
                ages.push(`${age}岁`);
                
                const dayunCycle = Math.sin((age - 1) * Math.PI / 10) * 2.5;
                const liunanCycle = Math.sin((age - 1) * Math.PI / 6) * 1.5;
                const wuxingCycle = Math.sin((age - ganScore % 20) * Math.PI / 5) * 1;
                
                const baseFortune = 5 + (ganScore + zhiScore) / 40;
                const fortuneValue = baseFortune + dayunCycle + liunanCycle + wuxingCycle + (Math.random() - 0.5) * 1;
                fortunes.push(Math.max(1.5, Math.min(9.5, fortuneValue)).toFixed(1));
                
                const wealthBase = 5 + (ganScore % 30) / 10;
                const wealthValue = wealthBase + Math.sin((age - 15) * Math.PI / 15) * 2.8 + (Math.random() - 0.5) * 1.2;
                wealth.push(Math.max(1.5, Math.min(9.5, wealthValue)).toFixed(1));
                
                const loveBase = 5 + (zhiScore % 35) / 10;
                const loveValue = loveBase + Math.sin((age - 20) * Math.PI / 8) * 2.5 + (Math.random() - 0.5) * 1;
                love.push(Math.max(1.5, Math.min(9.5, loveValue)).toFixed(1));
                
                const healthBase = 5 + (ganScore % 25) / 10;
                const healthValue = healthBase + Math.sin((age - 30) * Math.PI / 12) * 2 + (Math.random() - 0.5) * 0.8;
                health.push(Math.max(1.5, Math.min(9.5, healthValue)).toFixed(1));
            }
            
            return { ages, fortunes, wealth, love, health };
        }
        
        // 生成月度数据
        function generateMonthlyData(year, bazi, birthMonth) {
            const months = [];
            const fortunes = [];
            const wealth = [];
            const love = [];
            const health = [];
            const monthElements = [];
            
            const ganScore = (bazi.year.gan.charCodeAt(0) + bazi.month.gan.charCodeAt(0) + 
                            bazi.day.gan.charCodeAt(0) + bazi.hour.gan.charCodeAt(0)) % 50;
            const zhiScore = (bazi.year.zhi.charCodeAt(0) + bazi.month.zhi.charCodeAt(0) + 
                            bazi.day.zhi.charCodeAt(0) + bazi.hour.zhi.charCodeAt(0)) % 50;
            
            for (let month = 1; month <= 12; month++) {
                months.push(monthNames[month - 1]);
                
                const monthZhiIndex = (month + 1) % 12;
                const monthZhi = diZhi[monthZhiIndex];
                const monthElement = zhiWuxing[monthZhi];
                monthElements.push(monthElement);
                
                let elementBonus = 0;
                const dayGanElement = ganWuxing[bazi.day.gan];
                
                if (
                    (dayGanElement === '木' && monthElement === '水') ||
                    (dayGanElement === '火' && monthElement === '木') ||
                    (dayGanElement === '土' && monthElement === '火') ||
                    (dayGanElement === '金' && monthElement === '土') ||
                    (dayGanElement === '水' && monthElement === '金')
                ) {
                    elementBonus = 0.8;
                } else if (dayGanElement === monthElement) {
                    elementBonus = 0.6;
                } else if (
                    (dayGanElement === '木' && monthElement === '土') ||
                    (dayGanElement === '火' && monthElement === '金') ||
                    (dayGanElement === '土' && monthElement === '水') ||
                    (dayGanElement === '金' && monthElement === '木') ||
                    (dayGanElement === '水' && monthElement === '火')
                ) {
                    elementBonus = -0.3;
                } else {
                    elementBonus = -0.5;
                }
                
                const seasonBonus = Math.sin((month - birthMonth) * Math.PI / 6) * 0.8;
                const baseFortune = 5 + (ganScore + zhiScore) / 40 + elementBonus + seasonBonus;
                const fortuneValue = baseFortune + Math.sin(month * Math.PI / 3) * 1.2 + (Math.random() - 0.5) * 0.8;
                fortunes.push(Math.max(1.5, Math.min(9.5, fortuneValue)).toFixed(1));
                
                const wealthBase = 5 + (ganScore % 30) / 10 + (monthElement === '金' || monthElement === '水' ? 0.8 : 0);
                const wealthValue = wealthBase + Math.sin(month * Math.PI / 4) * 1.5 + (Math.random() - 0.5) * 1;
                wealth.push(Math.max(1.5, Math.min(9.5, wealthValue)).toFixed(1));
                
                const loveBase = 5 + (zhiScore % 35) / 10 + (monthElement === '火' || monthElement === '木' ? 0.6 : 0);
                const loveValue = loveBase + Math.sin((month + 2) * Math.PI / 5) * 1.3 + (Math.random() - 0.5) * 1;
                love.push(Math.max(1.5, Math.min(9.5, loveValue)).toFixed(1));
                
                const healthBase = 5 + (ganScore % 25) / 10 + (monthElement === '土' ? 0.5 : 0);
                const healthValue = healthBase + Math.sin((month + 4) * Math.PI / 6) * 1.2 + (Math.random() - 0.5) * 0.8;
                health.push(Math.max(1.5, Math.min(9.5, healthValue)).toFixed(1));
            }
            
            return { months, fortunes, wealth, love, health, year, monthElements };
        }
        
        // 生成大运周期数据
        function generateDecadeData(birthYear, bazi, gender) {
            const periods = [];
            const fortunes = [];
            const wealth = [];
            const love = [];
            const health = [];
            
            const ganScore = (bazi.year.gan.charCodeAt(0) + bazi.month.gan.charCodeAt(0) + 
                            bazi.day.gan.charCodeAt(0) + bazi.hour.gan.charCodeAt(0)) % 50;
            const zhiScore = (bazi.year.zhi.charCodeAt(0) + bazi.month.zhi.charCodeAt(0) + 
                            bazi.day.zhi.charCodeAt(0) + bazi.hour.zhi.charCodeAt(0)) % 50;
            
            for (let i = 0; i < 8; i++) {
                const ageStart = 1 + i * 10;
                const ageEnd = ageStart + 9;
                periods.push(`${ageStart}-${ageEnd}岁`);
                
                const dayunGanIndex = (ganScore + i) % 10;
                const dayunGan = tianGan[dayunGanIndex];
                const dayunElement = ganWuxing[dayunGan];
                const dayGanElement = ganWuxing[bazi.day.gan];
                
                let elementBonus = 0;
                if (
                    (dayGanElement === '木' && dayunElement === '水') ||
                    (dayGanElement === '火' && dayunElement === '木') ||
                    (dayGanElement === '土' && dayunElement === '火') ||
                    (dayGanElement === '金' && dayunElement === '土') ||
                    (dayGanElement === '水' && dayunElement === '金')
                ) {
                    elementBonus = 1.2;
                } else if (dayGanElement === dayunElement) {
                    elementBonus = 0.8;
                }
                
                const baseFortune = 5 + (ganScore + zhiScore) / 40 + elementBonus;
                const fortuneValue = baseFortune + Math.sin(i * Math.PI / 3) * 2 + (Math.random() - 0.5) * 0.8;
                fortunes.push(Math.max(1.5, Math.min(9.5, fortuneValue)).toFixed(1));
                
                const wealthValue = 5 + (ganScore % 30) / 10 + Math.sin(i * Math.PI / 2.5) * 1.8 + (Math.random() - 0.5) * 0.6;
                wealth.push(Math.max(1.5, Math.min(9.5, wealthValue)).toFixed(1));
                
                const loveValue = 5 + (zhiScore % 35) / 10 + Math.sin((i + 1) * Math.PI / 3) * 2 + (Math.random() - 0.5) * 0.7;
                love.push(Math.max(1.5, Math.min(9.5, loveValue)).toFixed(1));
                
                const healthValue = 5 + (ganScore % 25) / 10 + Math.sin(i * Math.PI / 4) * 1.5 + (Math.random() - 0.5) * 0.6;
                health.push(Math.max(1.5, Math.min(9.5, healthValue)).toFixed(1));
            }
            
            return { periods, fortunes, wealth, love, health };
        }
        
        function calculateBazi() {
            const year = parseInt(document.getElementById('year').value);
            const month = parseInt(document.getElementById('month').value);
            const day = parseInt(document.getElementById('day').value);
            const hour = parseInt(document.getElementById('hour').value);
            const gender = document.getElementById('gender').value;
            
            const daysInMonth = new Date(year, month, 0).getDate();
            if (day > daysInMonth) {
                alert('该月份没有这个日期，请重新输入');
                return;
            }
            
            const yearPillar = getYearPillar(year);
            const monthPillar = getMonthPillar(year, month);
            const dayPillar = getDayPillar(year, month, day);
            const hourPillar = getHourPillar(dayPillar.gan, hour);
            
            const bazi = {
                year: yearPillar,
                month: monthPillar,
                day: dayPillar,
                hour: hourPillar,
                birthMonth: month
            };
            
            birthYearGlobal = year;
            baziGlobal = bazi;
            genderGlobal = gender;
            
            document.getElementById('yearGan').textContent = yearPillar.gan;
            document.getElementById('yearZhi').textContent = yearPillar.zhi;
            document.getElementById('yearElement').textContent = yearPillar.element;
            
            document.getElementById('monthGan').textContent = monthPillar.gan;
            document.getElementById('monthZhi').textContent = monthPillar.zhi;
            document.getElementById('monthElement').textContent = monthPillar.element;
            
            document.getElementById('dayGan').textContent = dayPillar.gan;
            document.getElementById('dayZhi').textContent = dayPillar.zhi;
            document.getElementById('dayElement').textContent = dayPillar.element;
            
            document.getElementById('hourGan').textContent = hourPillar.gan;
            document.getElementById('hourZhi').textContent = hourPillar.zhi;
            document.getElementById('hourElement').textContent = hourPillar.element;
            
            document.getElementById('baziSection').classList.add('show');
            document.getElementById('chartSection').classList.add('show');
            
            initYearSelector(year);
            currentRange = 'year';
            updateChart();
        }
        
        function initYearSelector(birthYear) {
            const select = document.getElementById('selectedYear');
            const currentYear = new Date().getFullYear();
            select.innerHTML = '';
            
            for (let y = birthYear; y <= birthYear + 80; y++) {
                const option = document.createElement('option');
                option.value = y;
                option.textContent = `${y}年 (${y - birthYear}岁)`;
                if (y === currentYear) option.selected = true;
                select.appendChild(option);
            }
        }
        
        function changeTimeRange(range) {
            currentRange = range;
            
            document.querySelectorAll('.range-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            const yearSelector = document.getElementById('yearSelector');
            yearSelector.style.display = range === 'month' ? 'flex' : 'none';
            
            updateChart();
        }
        
        function updateChart() {
            if (!baziGlobal) return;
            
            let data;
            let xLabel;
            
            switch (currentRange) {
                case 'year':
                    data = generateYearlyData(birthYearGlobal, baziGlobal, genderGlobal);
                    data.labels = data.ages;
                    xLabel = '年龄';
                    break;
                case 'month':
                    const selectedYear = parseInt(document.getElementById('selectedYear').value);
                    data = generateMonthlyData(selectedYear, baziGlobal, baziGlobal.birthMonth);
                    data.labels = data.months;
                    xLabel = '月份';
                    monthlyDataGlobal = data;
                    break;
                case 'decade':
                    data = generateDecadeData(birthYearGlobal, baziGlobal, genderGlobal);
                    data.labels = data.periods;
                    xLabel = '大运周期';
                    break;
            }
            
            drawChart(data, xLabel);
            updateMetrics(data);
            updateMonthlyAnalysis();
        }
        
        function drawChart(data, xLabel) {
            const ctx = document.getElementById('fortuneChart').getContext('2d');
            
            if (chart) chart.destroy();
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.labels,
                    datasets: [
                        {
                            label: '综合指数',
                            data: data.fortunes,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2.5,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 5
                        },
                        {
                            label: '财运指数',
                            data: data.wealth,
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 4
                        },
                        {
                            label: '情感指数',
                            data: data.love,
                            borderColor: '#ec4899',
                            backgroundColor: 'rgba(236, 72, 153, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 4
                        },
                        {
                            label: '健康指数',
                            data: data.health,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 0,
                            pointHoverRadius: 4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: { size: 12, weight: '600' },
                                color: '#94a3b8',
                                padding: 15,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.95)',
                            padding: 12,
                            titleFont: { size: 14, weight: '600' },
                            bodyFont: { size: 12 },
                            titleColor: '#f1f5f9',
                            bodyColor: '#cbd5e1',
                            borderColor: '#334155',
                            borderWidth: 1,
                            cornerRadius: 8,
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.dataset.label}: ${context.parsed.y} 点`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            title: {
                                display: true,
                                text: xLabel,
                                font: { size: 12, weight: '600' },

                            },
                            ticks: {
                                color: '#64748b',
                                font: { size: 10 },
                                maxTicksLimit: 15
                            },
                            grid: {
                                color: 'rgba(51, 65, 85, 0.5)'
                            }
                        },
                        y: {
                            display: true,
                            title: {
                                display: true,
                                text: '指数点位',
                                font: { size: 12, weight: '600' },
                                color: '#94a3b8'
                            },
                            min: 0,
                            max: 10,
                            ticks: {
                                stepSize: 2,
                                color: '#64748b',
                                font: { size: 10 }
                            },
                            grid: {
                                color: 'rgba(51, 65, 85, 0.5)'
                            }
                        }
                    }
                }
            });
        }
        
        function updateMetrics(data) {
            const currentYear = new Date().getFullYear();
            const currentMonth = new Date().getMonth() + 1;
            const currentAge = currentYear - birthYearGlobal;
            
            let fortune, wealth, love, health;
            let prevFortune, prevWealth, prevLove, prevHealth;
            
            if (currentRange === 'month') {
                fortune = parseFloat(data.fortunes[currentMonth - 1]);
                wealth = parseFloat(data.wealth[currentMonth - 1]);
                love = parseFloat(data.love[currentMonth - 1]);
                health = parseFloat(data.health[currentMonth - 1]);
                prevFortune = currentMonth > 1 ? parseFloat(data.fortunes[currentMonth - 2]) : fortune;
                prevWealth = currentMonth > 1 ? parseFloat(data.wealth[currentMonth - 2]) : wealth;
                prevLove = currentMonth > 1 ? parseFloat(data.love[currentMonth - 2]) : love;
                prevHealth = currentMonth > 1 ? parseFloat(data.health[currentMonth - 2]) : health;
            } else if (currentRange === 'year') {
                if (currentAge > 0 && currentAge <= 80) {
                    fortune = parseFloat(data.fortunes[currentAge - 1]);
                    wealth = parseFloat(data.wealth[currentAge - 1]);
                    love = parseFloat(data.love[currentAge - 1]);
                    health = parseFloat(data.health[currentAge - 1]);
                    prevFortune = currentAge > 1 ? parseFloat(data.fortunes[currentAge - 2]) : fortune;
                    prevWealth = currentAge > 1 ? parseFloat(data.wealth[currentAge - 2]) : wealth;
                    prevLove = currentAge > 1 ? parseFloat(data.love[currentAge - 2]) : love;
                    prevHealth = currentAge > 1 ? parseFloat(data.health[currentAge - 2]) : health;
                }
            } else {
                const decadeIndex = Math.floor((currentAge - 1) / 10);
                if (decadeIndex >= 0 && decadeIndex < data.fortunes.length) {
                    fortune = parseFloat(data.fortunes[decadeIndex]);
                    wealth = parseFloat(data.wealth[decadeIndex]);
                    love = parseFloat(data.love[decadeIndex]);
                    health = parseFloat(data.health[decadeIndex]);
                    prevFortune = decadeIndex > 0 ? parseFloat(data.fortunes[decadeIndex - 1]) : fortune;
                    prevWealth = decadeIndex > 0 ? parseFloat(data.wealth[decadeIndex - 1]) : wealth;
                    prevLove = decadeIndex > 0 ? parseFloat(data.love[decadeIndex - 1]) : love;
                    prevHealth = decadeIndex > 0 ? parseFloat(data.health[decadeIndex - 1]) : health;
                }
            }
            
            if (fortune) {
                document.getElementById('currentIndex').textContent = fortune.toFixed(1) + ' 点';
                const change = fortune - prevFortune;
                const changePercent = ((change / prevFortune) * 100).toFixed(2);
                const changeEl = document.getElementById('changePercent');
                changeEl.textContent = (change >= 0 ? '+' : '') + changePercent + '%';
                changeEl.className = 'status-value ' + (change >= 0 ? '' : 'down');
                
                document.getElementById('fortuneIndex').textContent = fortune.toFixed(1);
                document.getElementById('wealthIndex').textContent = wealth.toFixed(1);
                document.getElementById('loveIndex').textContent = love.toFixed(1);
                document.getElementById('healthIndex').textContent = health.toFixed(1);
                
                updateMetricChange('fortuneChange', fortune - prevFortune);
                updateMetricChange('wealthChange', wealth - prevWealth);
                updateMetricChange('loveChange', love - prevLove);
                updateMetricChange('healthChange', health - prevHealth);
                
                // 根据基准线设置颜色
                document.getElementById('fortuneIndex').className = 'metric-value ' + (fortune > 5 ? 'up' : 'down');
                document.getElementById('wealthIndex').className = 'metric-value ' + (wealth > 5 ? 'up' : 'down');
                document.getElementById('loveIndex').className = 'metric-value ' + (love > 5 ? 'up' : 'down');
                document.getElementById('healthIndex').className = 'metric-value ' + (health > 5 ? 'up' : 'down');
            }
        }
        
        function updateMetricChange(elementId, change) {
            const el = document.getElementById(elementId);
            el.textContent = (change >= 0 ? '↑ +' : '↓ ') + change.toFixed(2);
            el.className = 'metric-change ' + (change >= 0 ? 'up' : 'down');
        }
        
        function updateMonthlyAnalysis() {
            const monthlyAnalysis = document.getElementById('monthlyAnalysis');
            
            if (currentRange !== 'month' || !monthlyDataGlobal) {
                monthlyAnalysis.classList.remove('show');
                return;
            }
            
            monthlyAnalysis.classList.add('show');
            
            const monthCards = document.getElementById('monthCards');
            monthCards.innerHTML = '';
            
            const data = monthlyDataGlobal;
            const avgFortune = data.fortunes.reduce((a, b) => parseFloat(a) + parseFloat(b), 0) / 12;
            
            for (let i = 0; i < 12; i++) {
                const fortune = parseFloat(data.fortunes[i]);
                const wealth = parseFloat(data.wealth[i]);
                const love = parseFloat(data.love[i]);
                const health = parseFloat(data.health[i]);
                const element = data.monthElements[i];
                
                let market = 'neutral';
                let trend = '横盘整理';
                if (fortune > 6) {
                    market = 'bullish';
                    trend = '上升趋势';
                } else if (fortune < 4) {
                    market = 'bearish';
                    trend = '下降趋势';
                }
                
                const advice = generateLifeAdvice(fortune, wealth, love, health, element, market);
                
                const card = document.createElement('div');
                card.className = `month-card ${market}`;
                card.innerHTML = `
                    <div class="month-header">
                        <span class="month-name">${monthNames[i]}</span>
                        <span class="month-score">${fortune.toFixed(1)}点</span>
                    </div>
                    <div class="month-trend">${trend} | ${element}五行</div>
                    <div class="month-advice">${advice}</div>
                `;
                
                monthCards.appendChild(card);
            }
        }
        
        function generateLifeAdvice(fortune, wealth, love, health, element, market) {
            const adviceTexts = {
                bullish: [
                    '运势旺盛，宜把握良机积极进取',
                    '多头行情，适合开展新计划',
                    '能量充沛，宜主动出击',
                    '诸事顺遂，大胆追求目标'
                ],
                bearish: [
                    '运势平淡，宜韬光养晦',
                    '空头趋势，谨慎行事为宜',
                    '能量稍弱，多休息调养',
                    '低调行事，避免冲突'
                ],
                neutral: [
                    '运势平稳，稳中求进',
                    '横盘蓄势，耐心等待时机',
                    '中庸之道，不宜冒进',
                    '保持节奏，循序渐进'
                ]
            };
            
            const advice = adviceTexts[market];
            let text = advice[Math.floor(Math.random() * advice.length)];
            
            // 根据具体指数给出针对性建议
            if (wealth > 7 && market === 'bullish') {
                text = '财运旺盛，适合开展财务规划';
            } else if (love > 7 && market === 'bullish') {
                text = '情感运势佳，适合增进感情';
            } else if (health > 7 && market === 'bullish') {
                text = '健康运势好，适合运动健身';
            } else if (health < 4) {
                text = '健康需关注，注意休息调养';
            } else if (love < 4) {
                text = '情感需呵护，多与亲友交流';
            }
            
            return text;
        }
        
        function clearAll() {
            document.getElementById('baziSection').classList.remove('show');
            document.getElementById('chartSection').classList.remove('show');
            if (chart) {
                chart.destroy();
                chart = null;
            }
            baziGlobal = null;
            monthlyDataGlobal = null;
        }
    </script>

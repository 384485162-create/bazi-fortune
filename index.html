<script>
const TG='甲乙丙丁戊己庚辛壬癸'.split('');
const DZ='子丑寅卯辰巳午未申酉戌亥'.split('');
let bd=null,sd=null;

(function(){
    const ys=document.getElementById('iYear');
    for(let y=2025;y>=1940;y--){const o=document.createElement('option');o.value=y;o.textContent=y+'年';if(y===1995)o.selected=true;ys.appendChild(o)}
    updDays();ys.onchange=updDays;document.getElementById('iMonth').onchange=updDays;
})();
function updDays(){
    const y=+document.getElementById('iYear').value,m=+document.getElementById('iMonth').value;
    const ds=document.getElementById('iDay'),mx=new Date(y,m,0).getDate(),old=+ds.value||1;
    ds.innerHTML='';for(let d=1;d<=mx;d++){const o=document.createElement('option');o.value=d;o.textContent=d+'日';if(d===Math.min(old,mx))o.selected=true;ds.appendChild(o)}
}

const gY=y=>({gan:TG[((y-4)%10+10)%10],zhi:DZ[((y-4)%12+12)%12]});
const gM=(y,m)=>{const g=(y-4)%10,gs=(g%5)*2;return{gan:TG[(gs+m-1)%10],zhi:DZ[m%12]}};
function gD(y,m,d){const b=new Date(1900,0,31),t=new Date(y,m-1,d),df=Math.floor((t-b)/864e5);return{gan:TG[((df%10)+10)%10],zhi:DZ[((df%12)+12)%12]}}
function gH(dg,h){return{gan:TG[(TG.indexOf(dg)+h)%10],zhi:DZ[h]}}
function mkCode(bz){const s=bz.year.gan+bz.year.zhi+bz.month.gan+bz.month.zhi+bz.day.gan+bz.day.zhi+bz.hour.gan+bz.hour.zhi;let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return(Math.abs(h)%100000000).toString().padStart(8,'0')}
function mkName(bz,n){return(n&&n.trim())?n.trim():['天命','星途','鸿运','青云','龙腾','锦绣','祥云','鹏程','瑞泽','金榜'][Math.abs((bz.day.gan.charCodeAt(0)+bz.day.zhi.charCodeAt(0))%10)]}
function score(bz){return(bz.year.gan.charCodeAt(0)+bz.month.gan.charCodeAt(0)+bz.day.gan.charCodeAt(0)+bz.hour.gan.charCodeAt(0))%50}
function gen80(bz){
    const s=score(bz),ls=[],da=[];
    let seed=bz.year.gan.charCodeAt(0)*1000+bz.month.gan.charCodeAt(0)*100+bz.day.gan.charCodeAt(0)*10+bz.hour.gan.charCodeAt(0);
    function R(){seed=(seed*9301+49297)%233280;return seed/233280}
    for(let a=1;a<=80;a++){ls.push(a+'岁');const w=Math.sin((a-1)*Math.PI/10)*2.5,x=Math.sin((a-1)*Math.PI/6)*1.5;da.push(+(Math.max(15,Math.min(95,50+s/4+w*10+x*10+Math.sin((a-s%20)*Math.PI/5)*10+(R()-.5)*6)).toFixed(2)))}
    return{labels:ls,data:da}
}

// 月度运势建议

        {t:'💕 <b>桃花爆炸月</b>\n\n本月你的桃花运直接拉满，身边会出现让你心跳加速的人。那种「怎么这么巧」的相遇概率飙升——可能是一次偶然的碰面、一个共同朋友的局、甚至你随手发的一条朋友圈就会引发蝴蝶效应。\n\n<b>建议：</b>大胆打破你的日常路线，去平时不去的地方。缘分就藏在「不一样」里。\n\n<b>适合做的事：</b>答应那些你平时会拒绝的邀约，多出现在人多的场合，你的桃花运藏在人群里。',

        d:'🌧 <b>社交能量偏弱</b>\n\n本月不适合主动出击，容易遇到「热脸贴冷屁股」的尴尬局面。你的社交直觉也不太准，容易把礼貌当暧昧、把暧昧当空气。\n\n<b>建议：</b>降低期待值，把注意力放在搞钱上。事业运和桃花运是跷跷板，这个月搞钱为主，感情的事下个月再说。\n\n<b>适合做的事：</b>复盘、计划、提升、搞钱。',
        up:['🌸','感情运势'],
        down:['🌧','感情运势']},
        {t:'💌 <b>有人在偷偷喜欢你</b>\n\n这个月有一个人对你心动了，但ta是个闷骚型选手——不会直说，只会用各种「不明显但仔细想想好像有点明显」的方式暗示你。\n\n<b>如何识别：</b>\n① 明明没话找话还坚持找你聊天\n② 你的每条朋友圈ta都点赞甚至秒赞\n③ 在人群中会不自觉地看向你的方向\n④ 总是能「巧合」地出现在你附近\n\n<b>建议：</b>如果你对ta也有好感，本月适合释放信号——不用表白，多聊两句就够了。',
        d:'📵 <b>信号紊乱月</b>\n\n本月你特别容易误读对方的信号：\n\n你以为人家在撩你 → 其实人家只是礼貌\n你以为人家不在意你 → 其实人家每天看你朋友圈三次\n你以为只是普通朋友 → 其实人家已经把你当备胎了\n\n<b>建议：</b>不确定的时候别脑补，直接问或者再观察观察。这个月你的感情雷达不太准，别靠直觉做决定。\n\n<b>原则：</b>没明确说喜欢你的，一律当朋友处理。',

        {t:'🌟 <b>感情关键时刻</b>\n\n本月你的感情状态会迎来一个重要节点——要么表白、要么被表白、要么正式决定一段关系的走向。无论哪个结局，都是在推动你走向对的人。\n\n<b>如果你有暗恋对象：</b>本月是最好的开口时机。宇宙在帮你制造机会，勇敢一点。\n\n<b>如果你在犹豫要不要分手：</b>本月你会得到答案。不是别人给你的，是你自己终于想明白了。\n\n<b>本月感情座右铭：</b>该来的挡不住，该走的留不住。',
        d:'🔄 <b>感情反思期</b>\n\n本月你会突然想清楚一些之前一直纠结的事情——为什么会分手、为什么总是遇到同一类人、为什么总是在同一个问题上跌倒。\n\n这个顿悟的过程可能有点扎心，但想通了就海阔天空。\n\n<b>建议：</b>允许自己难过一下，但别沉溺太久。写下来、说出来、和朋友聊聊，比你一个人闷着强。\n\n<b>本月适合：</b>独处、反思、和老朋友叙旧。',

function drawK(d80,age){
    const cv=document.getElementById('kline'),ctx=cv.getContext('2d');
    const W=cv.offsetWidth,H=180;cv.width=W*2;cv.height=H*2;cv.style.height=H+'px';ctx.scale(2,2);
    const n=80,pL=36,pR=4,pT=8,pB=20,cW=W-pL-pR,cH=H-pT-pB;
    const x0=i=>pL+i/n*cW,yV=v=>pT+(1-(v-10)/90)*cH;
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#101018';ctx.fillRect(0,0,W,H);
    ctx.font='9px -apple-system,sans-serif';ctx.textAlign='right';
    for(let v=20;v<=100;v+=20){const y=yV(v);ctx.strokeStyle='rgba(30,30,48,.5)';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(pL,y);ctx.lineTo(pL+cW,y);ctx.stroke();ctx.fillStyle='#383848';ctx.fillText(v,pL-3,y+3)}
    ctx.textAlign='center';for(let i=0;i<n;i+=10)ctx.fillText(d80.labels[i],x0(i),H-4);
    const g=ctx.createLinearGradient(0,pT,0,pT+cH);
    g.addColorStop(0,'rgba(239,68,68,.12)');g.addColorStop(.5,'rgba(239,68,68,.02)');g.addColorStop(1,'rgba(16,185,129,0)');
    ctx.beginPath();ctx.moveTo(x0(0),yV(d80.data[0]));for(let i=1;i<n;i++)ctx.lineTo(x0(i),yV(d80.data[i]));ctx.lineTo(x0(n-1),pT+cH);ctx.lineTo(x0(0),pT+cH);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    const ci=Math.max(0,age-1);
    ctx.beginPath();for(let i=0;i<n;i++){const x=x0(i),y=yV(d80.data[i]);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.strokeStyle=d80.data[ci]>=50?'#ef4444':'#10b981';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke();
    const cx=x0(ci),cy=yV(d80.data[ci]);
    ctx.setLineDash([3,3]);ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx,pT);ctx.lineTo(cx,pT+cH);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle=d80.data[ci]>=50?'#ef4444':'#10b981';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 11px -apple-system,sans-serif';ctx.textAlign='left';ctx.fillText(d80.data[ci].toFixed(2),cx+8,cy-4);
}

function go(){
    const y=+document.getElementById('iYear').value,m=+document.getElementById('iMonth').value,d=+document.getElementById('iDay').value,h=+document.getElementById('iHour').value,nm=document.getElementById('iName').value;
    if(d>new Date(y,m,0).getDate()){alert('日期不对哦');return}
    bd={year:gY(y),month:gM(y,m),day:gD(y,m,d),hour:gH(gD(y,m,d).gan,h),y,m};
    sd={code:mkCode(bd),name:mkName(bd,nm)};
    document.getElementById('home').style.display='none';
    document.getElementById('r').classList.add('show');
    document.title=sd.name+'的命运代码 · 人生股票';
    render();
}

function render(){
    const age=new Date().getFullYear()-bd.y;
    const d80=gen80(bd);
    const ipo=d80.data[0];
    const idx=Math.max(0,age-1),v=d80.data[idx];
    const chg=v-ipo,pct=(chg/ipo*100).toFixed(1),up=v>=50;

    document.getElementById('rName').textContent=sd.name;
    document.getElementById('rCode').textContent=sd.code+' · MKT';

    // 上市价
    const ipoEl=document.getElementById('rIPO');
    ipoEl.textContent=ipo.toFixed(2);
    ipoEl.className='price-num up';

    // 当前价
    const nowEl=document.getElementById('rNow');
    nowEl.textContent=v.toFixed(2);
    nowEl.className='price-num '+(up?'up':'dn');
    const nowChg=document.getElementById('rNowChg');
    nowChg.textContent=(chg>=0?'▲ ':'▼ ')+Math.abs(chg).toFixed(2)+' ('+(chg>=0?'+':'−')+pct+'%)';
    nowChg.className='price-chg '+(chg>=0?'up':'dn');

    // 等级
    let lvl,pctFill;
    if(v>=80){lvl='🌟 大吉';pctFill=95}else if(v>=70){lvl='✨ 吉';pctFill=82}
    else if(v>=55){lvl='📈 旺';pctFill=65}else if(v>=45){lvl='➡ 平';pctFill=50}
    else if(v>=35){lvl='📉 弱';pctFill=32}else{lvl='🌫 低迷';pctFill=18}
    const fill=document.getElementById('rFill');
    fill.style.width=pctFill+'%';fill.style.background=up?'linear-gradient(90deg,#ef4444,#f97316)':'linear-gradient(90deg,#10b981,#06b6d4)';
    document.getElementById('rLvl').textContent=lvl;

    // badge
    const badge=document.getElementById('rBadge');
    if(chg>0){badge.textContent='📈 涨';badge.className='badge up'}else if(chg<0){badge.textContent='📉 跌';badge.className='badge dn'}else{badge.textContent='➡ 平';badge.className='badge flat'}

    drawK(d80,age);

    // 当月运势（对比上市价）
    const curM=new Date().getMonth();
    const mIdx=Math.max(0,Math.min(79,age-1));
    const mV=d80.data[mIdx];
    const mChg=mV-ipo;
    const advice=monthAdvice(bd,mV,mChg);
    document.getElementById('rSigLbl').textContent='📅 '+(curM+1)+'月 '+advice.aspect+'运势参考';
    const trendEl=document.getElementById('rSigTrend');
    if(mChg>1.5){trendEl.textContent='📈 预计涨';trendEl.className='sig-trend up'}
    else if(mChg<-1.5){trendEl.textContent='📉 预计跌';trendEl.className='sig-trend dn'}
    else{trendEl.textContent='➡ 预计平稳';trendEl.className='sig-trend flat'}
    document.getElementById('rSigTip').innerHTML=mChg>=0?advice.up:advice.down;
}

function back(){document.getElementById('r').classList.remove('show');document.getElementById('home').style.display='';document.title='人生股票 · 看看你的命运值多少钱'}
